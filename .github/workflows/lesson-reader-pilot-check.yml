name: Verify the shared lesson reading layout
on:
  push:
    branches: ['codex/lesson-23-reader']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the existing site
        run: |
          node --check app.js
          node --check knowledge-map.js
          node --check skill-tree.js
          node --check skill-tree-data.js
          node --check content.js
          python3 scripts/build-course.py
          node --check course.js
          node --check lesson14.js
          node --check verb-data.js
          node --check verb-knowledge.js
          python3 scripts/check-site.py
          python3 scripts/test_verb_build.py
          python3 scripts/test_grammar_build.py
          node --test scripts/*.test.cjs
          git diff --exit-code
      - name: Verify desktop and mobile reading interactions
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          markup = Path('index.html').read_text(encoding='utf-8')
          test = r'''
          <script>
          (async () => {
            const assert = (ok, message) => { if (!ok) throw new Error(message); };
            const wait = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            const marker = document.createElement('output');
            marker.id = 'reader-qa';
            document.body.append(marker);
            try {
              await wait();
              const n = Number(location.hash.split('/')[1]);
              const mobile = innerWidth <= 800;
              const nav = document.getElementById('navigation');
              const toggle = document.getElementById('navigation-toggle');
              const toc = document.querySelector('.lesson-reader-index');
              const list = toc.querySelector('.lesson-reader-index-links');
              const tocToggle = toc.querySelector('button');
              const section = id => document.getElementById('lesson' + n + '-' + id);
              const active = () => list.querySelector('[aria-current]')?.dataset.sectionTarget;
              const course = window.COURSE_LIBRARY.lessons.find(lesson => lesson.number === n);
              assert(document.body.classList.contains('lesson-reader-active'), 'missing reader');
              assert(getComputedStyle(nav).display === 'none', 'global menu starts open');
              toggle.click();
              assert(getComputedStyle(nav).display !== 'none', 'global menu cannot open');
              toggle.click();
              assert(document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1, 'page overflows');
              const links = Array.from(list.querySelectorAll('a'));
              const ids = links.map(link => link.dataset.sectionTarget);
              const expected = [...course.sections.map(s => s.id), 'quick-check'].map(id => 'lesson' + n + '-' + id);
              assert(JSON.stringify(ids) === JSON.stringify(expected), 'directory omits or reorders chapters');
              const assertRows = () => {
                const rows = links.map(link => link.getBoundingClientRect());
                assert(rows.every((row, i) => row.width >= list.clientWidth - 6 &&
                  (i === 0 || (Math.abs(row.left - rows[0].left) <= 1 && row.top >= rows[i-1].bottom))),
                  'reader directory does not use a full-width row per chapter');
              };
              if (mobile) {
                assert(getComputedStyle(list).display === 'none', 'mobile directory starts open');
                tocToggle.click();
                assert(tocToggle.getAttribute('aria-expanded') === 'true', 'mobile directory cannot open');
                assert(getComputedStyle(list).display !== 'none', 'mobile directory hidden when open');
                assertRows();
                links[2].click();
                await wait();
                assert(tocToggle.getAttribute('aria-expanded') === 'false', 'mobile directory did not close after navigation');
                assert(active() === ids[2], 'mobile chapter link did not activate');
                assert(toc.getBoundingClientRect().top >= 0, 'mobile directory button scrolled out of view');
              } else {
                assert(toc.getBoundingClientRect().left >= section('scope').getBoundingClientRect().right, 'directory is not to the right');
                assertRows();
                list.style.maxHeight = '100px';
                section('practice').scrollIntoView();
                await wait();
                assert(active() === section('practice').id, 'scrolling did not activate practice: ' + active());
                assert(list.scrollTop > 0, 'directory did not auto-scroll');
                section('scope').scrollIntoView();
                await wait();
                const first = links[0].getBoundingClientRect();
                const visible = list.getBoundingClientRect();
                assert(active() === ids[0] && first.top >= visible.top - 1 && first.bottom <= visible.bottom + 1, 'first entry was not scrolled into view');
              }
              const answer = section('practice').querySelector('details');
              assert(answer && !answer.open, 'exercise answer unavailable or already open');
              dispatchEvent(new Event('beforeprint'));
              assert(answer.open, 'print did not include original answer');
              dispatchEvent(new Event('afterprint'));
              assert(!answer.open, 'print did not restore answer state');
              const noteSelector = '[data-note="lesson-' + n + '"]';
              const note = document.querySelector(noteSelector);
              note.value = 'Reading layout test note';
              note.dispatchEvent(new Event('input', {bubbles:true}));
              location.hash = '#lesson/24';
              await wait();
              assert(document.body.classList.contains('lesson-reader-active'), 'note-only lesson lost the compact layout');
              assert(!document.querySelector('.lesson-reader-index') && document.querySelector('[data-note="lesson-24"]'), 'note-only lesson must expose its note');
              location.hash = '#route';
              await wait();
              assert(!document.body.classList.contains('lesson-reader-active'), 'learning route unexpectedly uses the reader');
              if (!mobile) assert(getComputedStyle(nav).display !== 'none', 'learning route lost its sidebar');
              location.hash = '#lesson/' + n + '/' + course.sections[2].id;
              await wait();
              assert(document.querySelector(noteSelector)?.value === 'Reading layout test note', 'stored note not restored');
              assert(document.querySelector('.lesson-reader-index [aria-current]')?.dataset.sectionTarget === ids[2], 'old chapter link did not reach its section');
              marker.textContent = 'PASS ' + n + ' ' + (mobile ? 'mobile' : 'desktop');
            } catch (error) {
              marker.textContent = 'FAIL ' + error.message;
            }
          })();
          </script>
          '''
          Path('lesson-reader-qa.html').write_text(markup.replace('</body>',test+'</body>'),encoding='utf-8')
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 &
          qa_server=$!
          trap 'kill "$qa_server"' EXIT
          for try in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/lesson-reader-qa.html -o /dev/null; then break; fi
            sleep 1
          done
          qa_driver_path=$(command -v chromedriver || true)
          if [ -z "$qa_driver_path" ]; then qa_driver_path="$CHROMEWEBDRIVER/chromedriver"; fi
          "$qa_driver_path" --port=9515 > /tmp/lesson-reader-driver.log 2>&1 &
          qa_driver=$!
          trap 'kill "$qa_server" "$qa_driver"' EXIT
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          address = 'http://127.0.0.1:9515'

          def driver(path, payload=None, method=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(address+path, data=data, method=method, headers={'Content-Type':'application/json'})
              with urlopen(request, timeout=10) as response:
                  return json.load(response)['value']

          for i in range(50):
              try:
                  if driver('/status')['ready']:
                      break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('ChromeDriver did not start')

          for lesson, name, width in [(1,'desktop',1365), (14,'desktop',900), (22,'mobile',500), (23,'desktop',1365)]:
              caps = {'browserName':'chrome','goog:chromeOptions': {'args':['--headless','--no-sandbox','--disable-dev-shm-usage']}}
              session = driver('/session',{'capabilities':{'alwaysMatch':caps}})['sessionId']
              target = '/session/'+session
              try:
                  driver(target+'/window/rect', {'width':width,'height':820})
                  driver(target+'/url', {'url':f'http://127.0.0.1:8765/lesson-reader-qa.html#lesson/{lesson}'})
                  for i in range(40):
                      result = driver(target+'/execute/sync', {'script':"return document.getElementById('reader-qa')?.textContent || '';", 'args':[]})
                      if result:
                          break
                      time.sleep(.1)
                  print(width, name, result, flush=True)
                  assert result == f'PASS {lesson} {name}', result
              finally:
                  driver(target, method='DELETE')
          PY
